<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aylin Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 18px; color: #58a6ff; }
header span { font-size: 13px; color: #8b949e; }
.container { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 280px; border-left: 1px solid #30363d; background: #161b22; overflow-y: auto; }
.sidebar-header { padding: 12px 16px; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
.chat-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #21262d; transition: background 0.1s; }
.chat-item:hover, .chat-item.active { background: #1f2937; }
.chat-item .name { font-size: 14px; font-weight: 500; }
.chat-item .preview { font-size: 12px; color: #8b949e; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.msg.user { background: #1f6feb; align-self: flex-start; border-bottom-right-radius: 4px; }
.msg.bot { background: #21262d; align-self: flex-end; border-bottom-left-radius: 4px; }
.msg .time { font-size: 11px; opacity: 0.6; margin-top: 4px; }
.send-area { border-top: 1px solid #30363d; padding: 12px 16px; display: flex; gap: 8px; background: #161b22; }
.send-area input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; }
.send-area input:focus { border-color: #58a6ff; }
.send-area button { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.send-area button:hover { background: #2ea043; }
.empty { display: flex; align-items: center; justify-content: center; flex: 1; color: #8b949e; font-size: 14px; }
.stats { padding: 8px 16px; background: #0d1117; border-top: 1px solid #30363d; font-size: 12px; color: #8b949e; display: flex; gap: 20px; }
</style>
</head>
<body>
<header>
    <h1>🤖 Aylin Dashboard</h1>
    <span id="statsLabel">טוען...</span>
</header>
<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">שיחות</div>
        <div id="chatList"><div style="padding:16px;color:#8b949e;font-size:13px">טוען שיחות...</div></div>
    </div>
    <div class="main">
        <div class="messages" id="messages"><div class="empty">בחר שיחה מהרשימה</div></div>
        <div class="send-area">
            <input id="sendInput" placeholder="כתוב הודעה..." onkeydown="if(event.key==='Enter')sendMsg()">
            <button onclick="sendMsg()">שלח</button>
        </div>
    </div>
</div>

<script>
let currentChat = null;
const creds = btoa(prompt('משתמש:סיסמה', 'admin:aylin123') || 'admin:aylin123');
const headers = { 'Authorization': 'Basic ' + creds, 'Content-Type': 'application/json' };

async function loadChats() {
    try {
        const r = await fetch('/api/chats', { headers });
        const chats = await r.json();
        const el = document.getElementById('chatList');
        if (!chats.length) { el.innerHTML = '<div style="padding:16px;color:#8b949e;font-size:13px">אין שיחות עדיין</div>'; return; }
        el.innerHTML = chats.map(c => `
            <div class="chat-item" onclick="loadChat('${c.id}', this)">
                <div class="name">${c.name}</div>
                <div class="preview">${escHtml(c.lastMessage)}</div>
            </div>`).join('');
    } catch(e) { document.getElementById('chatList').innerHTML = '<div style="padding:16px;color:#f85149">שגיאה בטעינה</div>'; }
}

async function loadChat(id, el) {
    currentChat = id;
    document.querySelectorAll('.chat-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    const box = document.getElementById('messages');
    box.innerHTML = '<div class="empty">טוען...</div>';
    try {
        const r = await fetch(`/api/chat/${encodeURIComponent(id)}`, { headers });
        const msgs = await r.json();
        if (!msgs.length) { box.innerHTML = '<div class="empty">אין הודעות</div>'; return; }
        box.innerHTML = msgs.map(m => `
            <div class="msg ${m.from}">
                ${escHtml(m.body)}
                <div class="time">${new Date(m.timestamp * 1000).toLocaleTimeString('he-IL')}</div>
            </div>`).join('');
        box.scrollTop = box.scrollHeight;
    } catch(e) { box.innerHTML = '<div class="empty">שגיאה</div>'; }
}

async function sendMsg() {
    const inp = document.getElementById('sendInput');
    const text = inp.value.trim();
    if (!text || !currentChat) return;
    inp.value = '';
    try {
        await fetch('/api/send', { method: 'POST', headers, body: JSON.stringify({ to: currentChat, text }) });
        loadChat(currentChat, document.querySelector('.chat-item.active'));
    } catch(e) { alert('שגיאה בשליחה'); }
}

async function loadStats() {
    try {
        const r = await fetch('/api/stats', { headers });
        const s = await r.json();
        document.getElementById('statsLabel').textContent = `${s.activeChats} שיחות | ${s.totalMessages} הודעות`;
    } catch(_) {}
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadChats();
loadStats();
setInterval(loadStats, 30000);
</script>
</body>
</html>
